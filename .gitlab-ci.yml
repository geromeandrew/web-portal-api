stages:
  - test
  - package
  - deploy

variables:
  PNPM_STORE_DIR: .pnpm-store
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: /certs/client

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

test:
  stage: test
  image: node:22-alpine
  script:
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
    - pnpm test
    - pnpm build

package:
  stage: package
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  needs:
    - test
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --pull -t "$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_production:
  stage: deploy
  image: alpine:3.21
  needs:
    - package
  resource_group: production
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - chmod 400 "$SSH_PRIVATE_KEY"
    - eval "$(ssh-agent -s)"
    - ssh-add "$SSH_PRIVATE_KEY"
  script:
    - >
      printf '%s' "$REGISTRY_PASSWORD" |
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST"
      "docker login '$CI_REGISTRY' --username '$REGISTRY_USER' --password-stdin &&
      cd /home/ubuntu/apps/web-portal-api &&
      export API_IMAGE='$IMAGE_TAG' &&
      docker compose --env-file .env -f compose.deploy.yml pull &&
      docker compose --env-file .env -f compose.deploy.yml run --rm migrate &&
      docker compose --env-file .env -f compose.deploy.yml up -d --no-deps api &&
      docker compose --env-file .env -f compose.deploy.yml ps &&
      docker image prune -f"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
