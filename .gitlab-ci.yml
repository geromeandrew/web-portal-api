default:
    tags:
        - $PE_RUNNER_TAG
        
include:
    - project: globetelecom/common-toolchains/pipeline-coe/pipeline-modules
      ref: main
      file:
       - Application.gitlab-ci.yml

stages:
    - test
    - build_image
    - scan_image
    - publish_image


build_image:
    stage: build_image
    extends: .docker-build:kaniko-updated-vars
    rules:
      # 1. Dev Environment (Triggers ONLY on tags starting with 'dev-')
      - if: '$CI_COMMIT_TAG =~ /^dev-/'
        variables:
          TARGET_ISSUER: $DEV_OKTA_ISSUER

      # 2. Staging Environment (Triggers ONLY on tags starting with 'stg-')
      - if: '$CI_COMMIT_TAG =~ /^stg-/'
        variables:
          TARGET_ISSUER: $STG_OKTA_ISSUER

      # 3. Production Environment (Triggers ONLY on version tags like v1.0.0)
      - if: '$CI_COMMIT_TAG =~ /^v[0-9]+/'
        variables:
          TARGET_ISSUER: $PRD_OKTA_ISSUER

    script:
      # The template already handles JFrog authentication in the background!
      # Just run the Kaniko command with your appended build arguments:
      - /kaniko/executor 
        --context $CI_PROJECT_DIR 
        --dockerfile $CI_PROJECT_DIR/Dockerfile 
        --build-arg "JFROG_USERNAME=$PE_ARTIFACT_SA_USERNAME" 
        --build-arg "JFROG_PASSWORD=$PE_ARTIFACT_SA_TOKEN" 
        --build-arg "ARTIFACTORY_URL=$PE_ARTIFACTORY_URL" 
        --build-arg "VITE_OKTA_ISSUER=$TARGET_ISSUER" 
        --tarPath ${CI_PROJECT_DIR}/app_image.tar 
        --destination ${PE_ARTIFACTORY_URL}/${PE_ARTIFACT_DOCKER_LOCAL_REPO}/${CI_PROJECT_NAME}:${CI_COMMIT_TAG} 
        --no-push

    artifacts:
        paths:
            - "*.tar"

scan_image:
    stage: scan_image
    extends: .app-scan:prisma-image-pe
    only:
        - tags
    needs:
        - build_image

publish_image:
    stage: publish_image
    extends: .docker-publish:jfrog
    script:
        - crane auth login -u ${JFROG_USERNAME} -p ${JFROG_PASSWORD} ${PE_JFROG_URL}
        - mv app_image.tar ${CI_PROJECT_NAME}.tar
        - crane push ${CI_PROJECT_DIR}/${CI_PROJECT_NAME}.tar "${PE_JFROG_URL}/${PE_JFROG_REPOSITORY}/${CI_PROJECT_NAME}:${CI_COMMIT_TAG}"
    only:
        - tags
