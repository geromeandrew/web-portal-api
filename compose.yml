name: web-portal-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile-local
    image: web-portal-api:local
    pull_policy: build
    ports:
      - "3001:3001"
    env_file: .env
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command: ["pnpm", "local"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3001/api/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  api_node_modules:
